name: SGB smoke

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/validate-sgb.mjs"
      - ".github/workflows/sgb-smoke.yml"

jobs:
  validate-sgb:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Validate official flood GeoJSON
        run: node scripts/validate-sgb.mjs
